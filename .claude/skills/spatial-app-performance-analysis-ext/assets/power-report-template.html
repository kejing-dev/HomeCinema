<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{REPORT_TITLE}}</title>
<style>
:root{--bg:#0f1420;--card:#182030;--line:#2a3450;--txt:#e6ecf5;--sub:#93a1bd;--accent:#4da3ff;--good:#37d39b;--down:#ff6b7d;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0c111c,#0f1420 260px);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:1160px;margin:auto;padding:32px 22px 80px}
header.hero{background:linear-gradient(120deg,#16233f,#1a1d38 55%,#241a3a);border:1px solid var(--line);border-radius:18px;padding:34px;position:relative;overflow:hidden}
header.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;background:radial-gradient(circle,rgba(124,92,255,.35),transparent 70%)}
.tag{display:inline-block;background:#233152;color:var(--accent);border:1px solid var(--line);padding:3px 12px;border-radius:999px;font-size:12px;letter-spacing:.4px;margin-bottom:14px}
h1{margin:6px 0 4px;font-size:30px;letter-spacing:.4px}.mono,code{font-family:ui-monospace,"SF Mono",Consolas,monospace}h1 .mono{color:var(--accent)}
.subtitle,.note,.kpi-note{color:var(--sub);font-size:13.5px}.meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px;color:var(--sub);font-size:13px}.meta b{color:var(--txt)}
.verdict{margin-top:22px;background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.35);border-radius:12px;padding:14px 18px}.verdict b{color:var(--warn)}
section{margin-top:38px}h2{font-size:21px;margin:0 0 6px;display:flex;align-items:center;gap:10px}h2 .num{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#06101f;display:grid;place-items:center;font-size:15px;font-weight:700}
.lead{color:var(--sub);margin:0 0 18px;font-size:14px}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:820px){.g4,.g3,.g2{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
.kpi,.card,.chartbox{background:var(--card);border:1px solid var(--line);border-radius:14px}.kpi{padding:16px}.kpi .label{color:var(--sub);font-size:12.5px;margin-bottom:8px}.val{font-size:25px;font-weight:700}
.delta{display:inline-block;margin-top:8px;font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600}.neutral{background:rgba(147,161,189,.14);color:var(--sub)}.up{background:rgba(255,180,84,.14);color:var(--warn)}.down{background:rgba(255,107,125,.14);color:var(--down)}.good{background:rgba(55,211,155,.14);color:var(--good)}
.kpi-note{margin-top:8px;font-size:11.5px}.card{padding:20px 22px}table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th:first-child,td:first-child{text-align:left}thead th{color:var(--sub);font-size:12px;font-weight:600}tbody tr:hover{background:rgba(77,163,255,.05)}.metric{font-weight:600}
.change{display:inline-flex;flex-direction:column;align-items:flex-end;gap:1px;padding:2px 8px;border-radius:7px;font-weight:700;white-space:nowrap}.change small{font-size:10.5px;font-weight:500;opacity:.85}.change.decrease{color:var(--good);background:rgba(55,211,155,.14)}.change.increase{color:var(--down);background:rgba(255,107,125,.14)}.change.flat,.change.na{color:var(--sub);background:rgba(147,161,189,.14)}
.change-legend{align-items:center;flex-wrap:wrap;margin:8px 0 12px}.change-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}.legend-decrease{background:var(--good)}.legend-increase{background:var(--down)}.legend-neutral{background:var(--sub)}
.timeline{position:relative;margin:8px 0;padding-left:8px}.tl{display:grid;grid-template-columns:100px 1fr;gap:16px;padding:12px 0;border-left:2px solid var(--line);margin-left:8px;padding-left:20px;position:relative}.tl:before{content:"";position:absolute;left:-7px;top:18px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}.tl.hot:before{background:var(--down)}.tl.warn:before{background:var(--warn)}.tl-time{color:var(--accent);font:700 13px ui-monospace,Consolas,monospace}.tl.hot .tl-time{color:var(--down)}.tl.warn .tl-time{color:var(--warn)}.tl-desc{color:var(--sub);font-size:13.5px}.tl-desc b{color:var(--txt)}
.legend{display:flex;gap:16px;color:var(--sub);font-size:12px;margin:6px 2px}.callout{padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.warning{background:rgba(255,180,84,.08);border-color:rgba(255,180,84,.35)}ul.clean{margin:8px 0;padding-left:20px}ul.clean li{margin:5px 0}.foot{margin-top:44px;color:var(--sub);font-size:12px;text-align:center;border-top:1px solid var(--line);padding-top:20px}
</style>
</head>
<body>
{{REPORT_CONTENT}}
</body>
</html>
